<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lexa Download - HD No WM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;background:#05070d;color:#e8e8e8;font-family:'Inter',system-ui;background-image:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.9)),url('bg.jpg');background-size:cover;background-position:center;background-attachment:fixed}
.h{padding:16px 20px;display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.06);backdrop-filter:blur(10px)}
.logo{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:24px;letter-spacing:.5px}.logo span{color:#8ecfff;font-weight:400}
.t{margin-top:30px;text-align:center;font-family:'Cormorant Garamond',serif;font-size:42px;font-weight:600;letter-spacing:-.5px}.t span{color:#8ecfff;font-weight:400}
.sub{text-align:center;opacity:.35;letter-spacing:5px;font-size:10px;margin-top:6px;font-weight:300}
.box{margin:26px auto;max-width:560px;width:90%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:28px;display:flex;align-items:center;padding:0 6px 0 18px;backdrop-filter:blur(14px)}
.box input{flex:1;background:transparent;border:none;outline:none;color:#fff;padding:16px 10px;font-size:13px;font-weight:300;letter-spacing:.3px;font-family:'Inter'}
.box button{background:#8ecfff;color:#000;border:none;padding:12px 22px;border-radius:22px;font-size:10px;font-weight:700;letter-spacing:1.5px;cursor:pointer}
#status{text-align:center;margin-top:18px;font-size:11px;letter-spacing:2.5px;font-weight:300;text-transform:uppercase;opacity:.6;min-height:16px}
.results{max-width:580px;margin:16px auto;padding:0 14px;flex:1;width:100%}
.card{background:rgba(18,22,36,.72);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:14px;display:flex;gap:14px;margin-bottom:10px;backdrop-filter:blur(10px)}
.card img{width:62px;height:62px;border-radius:10px;object-fit:cover;opacity:.9}
.card b{font-size:13.5px;font-weight:500;letter-spacing:.2px;display:block}
.card small{opacity:.45;font-size:11.5px;font-weight:300;letter-spacing:.3px;display:block;margin-top:2px}
.btns{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.18);padding:6px 16px;border-radius:20px;font-weight:400;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:.2s}
.btn:hover{border-color:#fff;background:rgba(255,255,255,.08)}
.btn2{border-color:rgba(142,207,255,.4);color:#8ecfff;background:rgba(142,207,255,.08)}
.btn2:hover{background:rgba(142,207,255,.18);border-color:#8ecfff}
.preview{background:rgba(18,22,36,.85);border:1px solid rgba(142,207,255,.2);border-radius:18px;overflow:hidden;margin-bottom:12px}
.preview video,.preview img.p{width:100%;max-height:460px;object-fit:cover;display:block;background:#000}
.preview.info{padding:14px}
.footer{margin-top:auto;text-align:center;padding:38px 0 20px;opacity:.35;font-size:10px;letter-spacing:1.5px;font-weight:300;line-height:1.8}
</style>
</head>
<body>
<div class="h"><div><div class="logo"><span>Spotify</span> LèxaaMj</div><div style="opacity:.4;font-size:9px;letter-spacing:3px;font-family:'Inter';font-weight:300;margin-top:2px">DOWNLOAD EDITION • IG FIXED</div></div><div style="opacity:.35;font-size:9px;letter-spacing:2px">HD NO WM</div></div>
<div class="t">Lèxaa <span>Download</span></div>
<div class="sub">SPOTIFY • TIKTOK FOTO VIDEO • IG REELS POST • YT • HD NO WM</div>
<div class="box"><input id="q" placeholder="paste link tiktok / ig / yt / spotify atau search judul..."><button onclick="handle()">DOWNLOAD</button></div>
<div id="status">mp4 = mp4 • mp3 = mp3 • foto = foto hd • ig fixed hd</div>
<div class="results" id="results"></div>
<div class="footer">© 2026 Lèxaa Download • IG Reels/Post Fixed HD No WM<br>background same as spotify • permanent</div>
<script>
const statusEl=document.getElementById('status'),resultsEl=document.getElementById('results');
function detect(u){u=u.toLowerCase();if(u.includes('tiktok'))return 'tiktok';if(u.includes('instagram.com'))return 'ig';if(u.includes('youtube')||u.includes('youtu.be'))return 'yt';if(u.includes('spotify'))return 'spotify';return 'search';}
function extractUrl(t){const m=t.match(/https?:\/\/[^\s]+/i);return m?m[0].replace(/[.,;!\)]+$/,'').trim():t.trim();}
async function handle(){
 const raw=document.getElementById('q').value.trim();if(!raw)return;
 const url=extractUrl(raw);
 document.getElementById('q').value=url;
 const t=detect(url);
 if(t==='search')searchSpotify(url);
 else if(t==='tiktok')dlTikTok(url);
 else if(t==='ig')dlIG(url);
 else if(t==='yt')dlUniversal(url,'youtube hd');
 else if(t==='spotify')searchSpotify(url);
}
async function searchSpotify(q){
 statusEl.innerText='searching spotify • mp3 hd...';resultsEl.innerHTML='';
 try{
  let r=await fetch('https://api.spotifydown.com/search/'+encodeURIComponent(q));let j=await r.json();
  if(j.success&&j.trackList.length){
   statusEl.innerText=j.trackList.length+' results • mp3 320k hd';
   resultsEl.innerHTML=j.trackList.map(t=>`<div class="card"><img src="${t.cover}"><div style="flex:1;min-width:0"><b>${t.title}</b><small>${t.artists} • mp3 320kbps • hd</small><div class="btns"><button class="btn" onclick="window.open('https://open.spotify.com/track/${t.id}','_blank')">preview</button><button class="btn btn2" onclick="dlSpotify('${t.id}','${t.title.replace(/'/g,'')}')">download mp3 hd</button></div></div></div>`).join('');return;
  }
 }catch(e){}statusEl.innerText='no results';
}
async function dlSpotify(id,title){
 statusEl.innerText='preparing '+title.toLowerCase()+' • mp3 hd';
 try{let r=await fetch('https://api.spotifydown.com/download/'+id);let j=await r.json();if(j.success&&j.link){downloadFile(j.link,title+'.mp3');statusEl.innerText='downloaded • mp3 hd • '+title;return;}}catch(e){}window.open('https://spotifydown.com/'+id,'_blank');
}
async function dlTikTok(url){
 statusEl.innerText='tiktok • hd no wm...';
 resultsEl.innerHTML='<div class="card"><div style="flex:1"><b>Processing TikTok HD...</b><small>video / foto slide • mp4 mp3 jpg</small></div></div>';
 try{
  let r=await fetch('https://www.tikwm.com/api/?url='+encodeURIComponent(url)+'&hd=1');let j=await r.json();
  if(j.data){
   let d=j.data;
   if(d.images&&d.images.length){
    statusEl.innerText=`tiktok foto • ${d.images.length} foto hd no wm`;
    resultsEl.innerHTML=d.images.map((img,i)=>`<div class="card"><img src="${img}"><div style="flex:1"><b>Foto ${i+1} • JPG HD No WM</b><small>@${d.author?.unique_id||'tiktok'} • foto = foto hd</small><div class="btns"><button class="btn btn2" onclick="downloadFile('${img}','tiktok_foto_${i+1}_hd.jpg')">download jpg hd</button></div></div></div>`).join('')+`<div class="card"><div style="flex:1"><b>Music • MP3</b><small>mp3 = mp3 • hd audio</small><div class="btns"><button class="btn btn2" onclick="downloadFile('${d.music}','tiktok_music_hd.mp3')">download mp3</button></div></div></div>`;
   }else{
    statusEl.innerText='tiktok video • hd no wm';
    resultsEl.innerHTML=`<div class="preview"><video class="p" src="${d.play}" poster="${d.cover}" controls playsinline></video><div class="info"><b>${d.title||'TikTok Video'} • HD No WM</b><small>@${d.author?.unique_id} • mp4 hd no wm</small><div class="btns"><button class="btn btn2" onclick="downloadFile('${d.play}','tiktok_hd_no_wm.mp4')">download mp4 hd no wm</button><button class="btn" onclick="downloadFile('${d.hdplay||d.play}','tiktok_1080p.mp4')">1080p hd</button><button class="btn" onclick="downloadFile('${d.music}','tiktok_audio_hd.mp3')">mp3 audio</button></div></div></div>`;
   }return;
  }
 }catch(e){}
 dlUniversal(url,'tiktok hd');
}

// IG FIXED - 3 API + DIRECT PARSE
async function dlIG(url){
 statusEl.innerText='instagram • fetching hd...';
 resultsEl.innerHTML='<div class="card"><div style="flex:1"><b>Instagram • Fetching HD No WM...</b><small>reels / post / carousel • trying 3 servers...</small></div></div>';

 // API 1: Cobalt main
 try{
  let r1=await fetch('https://api.cobalt.tools/api/json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url,vQuality:'1080'})});
  let j1=await r1.json();
  if(j1.url){showIG(j1.url,j1.filename||'Instagram HD',j1.picker);return;}
  if(j1.picker){showIGPicker(j1.picker);return;}
 }catch(e){}
 // API 2: Cobalt backup wuk.sh
 try{
  let r2=await fetch('https://co.wuk.sh/api/json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url,vQuality:'1080',aFormat:'mp3'})});
  let j2=await r2.json();
  if(j2.url){showIG(j2.url,j2.filename||'Instagram HD',j2.picker);return;}
  if(j2.picker){showIGPicker(j2.picker);return;}
 }catch(e){}
 // API 3: SaveIG API
 try{
  let r3=await fetch('https://v3.saveig.app/api/ajaxSearch',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'q='+encodeURIComponent(url)+'&t=media&lang=en'});
  let j3=await r3.json();
  if(j3.data){
    let div=document.createElement('div');div.innerHTML=j3.data;
    let links=[...div.querySelectorAll('a')].map(a=>a.href).filter(h=>h.includes('.mp4')||h.includes('.jpg')||h.includes('scontent'));
    if(links.length){
      showIG(links[0],'Instagram HD SaveIG');return;
    }
  }
 }catch(e){}
 // API 4: ddinstagram proxy
 try{
  let short=url.replace('www.instagram.com','www.ddinstagram.com').replace('instagram.com','ddinstagram.com');
  let r4=await fetch('https://corsproxy.io/?'+encodeURIComponent(short));
  let txt=await r4.text();
  let m=txt.match(/"video_url":"([^"]+)"/);
  if(m){let v=m[1].replace(/\\u0026/g,'&').replace(/\\/g,'');showIG(v,'IG Reels HD via DD');return;}
  let img=txt.match(/"display_url":"([^"]+)"/);
  if(img){let im=img[1].replace(/\\u0026/g,'&').replace(/\\/g,'');showIG(im,'IG Post HD via DD');return;}
 }catch(e){}

 // kalau semua gagal baru backup
 statusEl.innerText='backup downloader • ig hd';
 resultsEl.innerHTML=`<div class="card"><div style="flex:1"><b>Instagram HD • Backup (IG blokir API)</b><small>link: ${url.substring(0,50)}... • klik IG REELS/POST HD dibawah, auto hd no wm</small><div class="btns"><button class="btn btn2" onclick="window.open('https://snapinsta.app/?url=${encodeURIComponent(url)}','_blank')">IG REELS/POST HD</button><button class="btn btn2" onclick="window.open('https://igram.world/?url=${encodeURIComponent(url)}','_blank')">IGRAM HD</button><button class="btn btn2" onclick="window.open('https://saveig.app/en?url=${encodeURIComponent(url)}','_blank')">SAVEIG HD</button></div></div></div>`;
}
function showIG(fileUrl,title){
 const isVideo=fileUrl.includes('.mp4')||fileUrl.includes('video');
 statusEl.innerText=`ig ${isVideo?'reels':'post'} • hd no wm • ready`;
 resultsEl.innerHTML=`<div class="preview">${isVideo?`<video class="p" src="${fileUrl}" controls playsinline></video>`:`<img class="p" src="${fileUrl}">`}<div class="info"><b>${title} • HD No WM</b><small>${isVideo?'mp4 = mp4 hd • no wm':'foto = foto hd • no wm'} • ready • preview + download</small><div class="btns"><button class="btn btn2" onclick="downloadFile('${fileUrl}','ig_hd_${Date.now()}.${isVideo?'mp4':'jpg'}')">DOWNLOAD ${isVideo?'MP4':'JPG'} HD NO WM</button><button class="btn" onclick="window.open('${fileUrl}','_blank')">OPEN DIRECT</button></div></div></div>`;
}
function showIGPicker(picker){
 statusEl.innerText=`ig carousel • ${picker.length} files • hd`;
 resultsEl.innerHTML=picker.map((p,i)=>`<div class="card"><img src="${p.thumb||''}"><div style="flex:1"><b>File ${i+1} • ${p.ext?.toUpperCase()||'HD'} • IG HD No WM</b><small>no wm • ${p.ext} = ${p.ext} • hd</small><div class="btns"><button class="btn btn2" onclick="downloadFile('${p.url}','ig_${i+1}_hd.${p.ext||'mp4'}')">DOWNLOAD ${p.ext?.toUpperCase()||'FILE'} HD</button></div></div></div>`).join('');
}
async function dlUniversal(url,label){
 statusEl.innerText=(label||'hd')+' • processing hd...';
 try{
  let res=await fetch('https://api.cobalt.tools/api/json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url,vQuality:'1080'})});
  let data=await res.json();
  if(data.url){showIG(data.url,data.filename||'HD');return;}
  if(data.picker){showIGPicker(data.picker);return;}
 }catch(e){}
 try{
  let res2=await fetch('https://co.wuk.sh/api/json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url,vQuality:'1080'})});
  let data2=await res2.json();
  if(data2.url){showIG(data2.url,data2.filename||'HD');return;}
  if(data2.picker){showIGPicker(data2.picker);return;}
 }catch(e){}
 resultsEl.innerHTML=`<div class="card"><div style="flex:1"><b>Backup HD No WM</b><small>api sibuk • klik manual hd</small><div class="btns"><button class="btn btn2" onclick="window.open('https://snapinsta.app/?url=${encodeURIComponent(url)}','_blank')">IG HD</button><button class="btn btn2" onclick="window.open('https://ssstik.io/en?url=${encodeURIComponent(url)}','_blank')">TIKTOK HD</button><button class="btn btn2" onclick="window.open('https://cobalt.tools/?url=${encodeURIComponent(url)}','_blank')">YT HD</button></div></div></div>`;
}
function downloadFile(url,name){const a=document.createElement('a');a.href=url;a.download=name;a.target='_blank';document.body.appendChild(a);a.click();a.remove();statusEl.innerText='downloaded • '+name+' • hd no wm';}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')handle();});
</script>
</body>
</html>
