<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin LèxaaMj</title>
<style>
body{background:#080a0f;color:#fff;font-family:system-ui;padding:20px}
h1{font-size:22px}
p{color:#8b90a3;font-size:13px;margin-top:6px}
.btn{background:#0a84ff;border:none;color:#fff;padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px}
.btn2{background:#1a1e2a}
table{width:100%;border-collapse:collapse;margin-top:20px;background:#12151f;border-radius:12px;overflow:hidden}
th,td{padding:12px;text-align:left;border-bottom:1px solid #1e2333;font-size:13px}
th{color:#8b90a3;font-size:11px;letter-spacing:1px}
.box{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<h1>Dashboard LèxaaMj</h1>
<p>Admin WA: 085642367261 - Jangan share link ini ke siapapun!</p>
<div class="box">
<button class="btn" onclick="load()">Refresh Data</button>
<button class="btn btn2" onclick="clearData()">Hapus Semua</button>
<button class="btn btn2" onclick="exportCSV()">Export CSV</button>
</div>
<table id="tbl">
<thead>
<tr>
<th>WAKTU</th>
<th>PRODUK</th>
<th>HARGA</th>
<th>WA PEMBELI</th>
<th>STATUS</th>
</tr>
</thead>
<tbody></tbody>
</table>
<p style="margin-top:20px">Cara pakai: Pembeli yang klik "Saya Sudah Bayar" di web utama bakal masuk kesini + langsung chat ke WA lu.</p>
<script>
function load(){
 const list=JSON.parse(localStorage.getItem('lexa_orders')||'[]');
 const tbody=document.querySelector('#tbl tbody');
 tbody.innerHTML='';
 list.forEach(r=>{
  tbody.innerHTML+=`<tr><td>${r.waktu}</td><td>${r.produk}</td><td>Rp${r.harga}</td><td>${r.wa_pembeli}</td><td>${r.status}</td></tr>`;
 });
 if(!list.length){
  tbody.innerHTML='<tr><td colspan=5 style="color:#8b90a3;text-align:center;padding:20px">Belum ada pembeli yang klik Saya Sudah Bayar</td></tr>';
 }
}
function clearData(){
 if(confirm('Yakin hapus semua data pembeli?')){
  localStorage.removeItem('lexa_orders');
  load();
 }
}
function exportCSV(){
 const list=JSON.parse(localStorage.getItem('lexa_orders')||'[]');
 if(!list.length){alert('Belum ada data');return;}
 let csv='Waktu,Produk,Harga,WA_Pembeli,Status\n';
 list.forEach(r=>{
  csv+=`"${r.waktu}","${r.produk}",${r.harga},"${r.wa_pembeli}","${r.status}"\n`;
 });
 const blob=new Blob([csv],{type:'text/csv'});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='orders_lexaamj_'+Date.now()+'.csv';
 a.click();
}
load();
</script>
</body>
</html>
