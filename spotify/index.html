<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify LèxaaMj</title>
<style>
body{background:#06080f;color:#fff;font-family:sans-serif;min-height:100vh;background-image:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.85)),url('bg.jpg');background-size:cover;background-position:center}
.search-box{margin:28px auto;max-width:520px;background:rgba(255,255,255,.08);border:1.5px solid #5ec9ff;border-radius:30px;display:flex;padding:0 18px}
.search-box input{flex:1;background:transparent;border:none;outline:none;color:#fff;padding:18px 10px;font-size:16px}
.card{background:rgba(20,25,40,.75);border-radius:16px;padding:12px;display:flex;gap:12px;margin:12px auto;max-width:620px}
.card img{width:72px;height:72px;border-radius:10px}
.btn{background:#1ed760;color:#000;border:none;padding:6px 14px;border-radius:20px;font-weight:700;margin-top:6px}
</style>
</head>
<body>
<center style="margin-top:30px"><h1>Spotify <span style="color:#5ec9ff">LèxaaMj</span></h1><p style="opacity:.5;letter-spacing:4px">SEARCH • PLAY • DOWNLOAD</p></center>
<div class="search-box"><input id="q" placeholder="Cari lagu - Gata Only..." onkeydown="if(event.key==='Enter')doSearch()"></div>
<div id="status" style="text-align:center"></div>
<div id="results"></div>
<script>
async function doSearch(){
  const query=document.getElementById('q').value.trim();
  if(!query) return;
  document.getElementById('status').innerText='Searching '+query+'...';
  try{
    let r=await fetch('https://itunes.apple.com/search?term='+encodeURIComponent(query)+'&media=music&limit=20');
    let j=await r.json();
    document.getElementById('status').innerText='';
    document.getElementById('results').innerHTML=j.results.map(t=>`
      <div class="card">
        <img src="${t.artworkUrl100.replace('100x100','300x300')}">
        <div><b>${t.trackName}</b><br><small style="opacity:.6">${t.artistName}</small><br>
        <button class="btn" onclick="new Audio('${t.previewUrl}').play()">▶ PLAY</button>
        <button class="btn" style="background:#ffffff22;color:#fff" onclick="window.open('https://www.youtube.com/results?search_query=${encodeURIComponent(t.artistName+' '+t.trackName)}','_blank')">⬇ YOUTUBE</button>
        </div>
      </div>`).join('');
  }catch(e){
    document.getElementById('status').innerText='Error, coba lagi Bos - '+e;
  }
}
</script>
</body>
</html>
