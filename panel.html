<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buyer Panel - LèxaaMj</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
body { background:#000; color:#fff; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
.card { background: rgba(18,18,18,0.9); border:1px solid rgba(255,255,255,0.07); border-radius:20px; padding:24px; width:100%; max-width:420px; }
input { width:100%; padding:12px 14px; border-radius:12px; border:1px solid #222; background:#0a0a0a; color:#fff; outline:none; margin:8px 0; font-size:13px; }
.btn-white { width:100%; padding:12px; border-radius:12px; border:none; font-weight:700; cursor:pointer; background:#fff; color:#000; margin-top:10px; }
.small { font-size:11px; color:#666; margin-top:6px; text-align:center; }
.code-box { background:#0f0f0f; border:1px solid #1e1e1e; border-radius:14px; padding:16px; margin:14px 0; text-align:center; }
.code-text { font-size:28px; font-weight:700; letter-spacing:4px; margin:10px 0; color:#fff; }
.copy-btn { background:#1a1a1a; color:#fff; border:1px solid #262626; padding:8px 16px; border-radius:8px; cursor:pointer; }
.status { font-size:10px; color:#0f0; text-align:center; margin-bottom:10px; }
</style>
</head>
<body>
<div class="card">
<div id="loginView">
<h3 style="text-align:center; letter-spacing:4px; margin-bottom:10px;">LÈXAA PANEL</h3>
<div class="status" id="connStatus">● CONNECTING CLOUD...</div>
<input id="lu" placeholder="Username">
<input id="lp" type="password" placeholder="Password">
<button class="btn-white" onclick="login()">LOGIN ACCESS</button>
<div class="small" id="loginMsg"></div>
</div>

<div id="gridView" style="display:none;">
<h3 style="text-align:center; letter-spacing:3px; font-size:14px;">PILIH LAYANAN</h3>
<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;">
<button class="btn-white" onclick="selectService('whatsapp')">WhatsApp</button>
<button class="btn-white" onclick="selectService('telegram')">Telegram</button>
<button class="btn-white" onclick="selectService('instagram')">Instagram</button>
<button class="btn-white" onclick="selectService('spotify')">Spotify</button>
</div>
<div id="phoneBox" style="display:none; margin-top:16px;">
<input id="phone" placeholder="Nomor WA (628xx)">
<button class="btn-white" onclick="requestCode()">REQUEST CODE</button>
</div>
<div id="detailStatus" style="display:none; margin-top:16px; text-align:center; font-size:13px;"></div>
<button class="btn-white" style="background:#1a1a1a; color:#fff; border:1px solid #262626; margin-top:20px;" onclick="logout()">LOGOUT</button>
</div>
</div>

<script>
const NPOINT_ID = "aab1330f806769a8d485";
const API_URL = `https://api.npoint.io/${NPOINT_ID}`;

let usersData = [];
let reqsData = [];
let myUser = null;
let currentService = null;
let currentReqId = null;

async function loadCloud(){
 try{
   const res = await fetch(API_URL);
   const data = await res.json();
   usersData = data.lex_users || [];
   reqsData = data.lex_reqs || [];
   document.getElementById('connStatus').innerText = '● CLOUD ACTIVE';
   return true;
 }catch(e){
   document.getElementById('connStatus').innerText = '● OFFLINE';
   return false;
 }
}
async function saveCloud(){
 await fetch(API_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({lex_users: usersData, lex_reqs: reqsData}) });
}

async function login(){
 const u=document.getElementById('lu').value.trim();
 const p=document.getElementById('lp').value.trim();
 if(!u||!p) return alert('isi username password');
 document.getElementById('loginMsg').innerText = 'Checking...';
 await loadCloud();
 const f = usersData.find(x=>x.username==u && x.password==p);
 if(!f){ document.getElementById('loginMsg').innerText = 'Username / Password Salah'; return; }
 if(!f.isUnlimited && f.expiredAt && new Date(f.expiredAt) < new Date()){ document.getElementById('loginMsg').innerText = 'Akun Expired'; return; }
 myUser=f;
 document.getElementById('loginView').style.display='none';
 document.getElementById('gridView').style.display='block';
}

function selectService(s){
 currentService=s;
 document.getElementById('phoneBox').style.display='block';
 document.getElementById('detailStatus').style.display='none';
}

async function requestCode(){
 const phone=document.getElementById('phone').value.trim();
 if(!phone) return alert('Isi nomor WA dulu');
 await loadCloud();
 const id=Date.now().toString();
 const newReq = {id, username:myUser.username, service:currentService, phone, status:'waiting', time:Date.now()};
 reqsData.push(newReq);
 await saveCloud();
 currentReqId=id;
 const sd=document.getElementById('detailStatus');
 sd.style.display='block';
 sd.innerHTML='⏳ Requesting code from LèxaaMj...<br><small>Please wait a moment</small><br><br><b>'+phone+'</b>';
 checkLoop();
}

function checkLoop(){
 if(!currentReqId) return;
 loadCloud().then(()=>{
   const r=reqsData.find(x=>x.id==currentReqId);
   if(!r) return;
   const s=document.getElementById('detailStatus');
   if(r.status=='waiting'){
     s.innerHTML='⏳ Requesting code from LèxaaMj...<br><small>Waiting admin</small><br><br><b>'+r.phone+'</b>';
     setTimeout(checkLoop, 3000);
   }else if(r.status=='code_sent'){
     s.innerHTML=`Your login code is ready:<div class="code-box"><div style="color:#666;font-size:11px">CODE LOGIN</div><div class="code-text">${r.code}</div><button class="copy-btn" onclick="copyCode('${r.code}')">Copy Code</button><br><small style="color:#666">From LèxaaMj</small></div>`;
   }else if(r.status=='connected'){
     s.innerHTML=`✅ <b>Bot ${r.service} Connected Successfully</b><br><br><button class="btn-white" onclick="backGrid()">Back to Menu</button>`;
   }else if(r.status=='failed'){
     s.innerHTML=`❌ Connection Failed<br><small>${r.reason||'Rejected'}</small><br><br><button class="btn-white" onclick="backGrid()">Try Again</button>`;
   }
 });
}

function copyCode(c){ navigator.clipboard.writeText(c); alert('Copied: '+c); }
function backGrid(){ document.getElementById('phoneBox').style.display='none'; document.getElementById('detailStatus').style.display='none'; currentReqId=null; }
function logout(){ location.reload(); }

loadCloud();
</script>
</body>
</html>
