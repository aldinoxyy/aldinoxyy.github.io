<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lexa Download - HD No WM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;background:#05070d;color:#e8e8e8;font-family:'Inter',system-ui;background-image:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.9)),url('bg.jpg');background-size:cover;background-position:center;background-attachment:fixed}
.h{padding:16px 20px;display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.06);backdrop-filter:blur(10px)}
.logo{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:24px}.logo span{color:#8ecfff}
.t{margin-top:30px;text-align:center;font-family:'Cormorant Garamond',serif;font-size:42px;font-weight:600}.t span{color:#8ecfff}
.sub{text-align:center;opacity:.35;letter-spacing:5px;font-size:10px;margin-top:6px}
.box{margin:26px auto;max-width:560px;width:90%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:28px;display:flex;align-items:center;padding:0 6px 0 18px;backdrop-filter:blur(14px)}
.box input{flex:1;background:transparent;border:none;outline:none;color:#fff;padding:16px 10px;font-size:13px}
.box button{background:#8ecfff;color:#000;border:none;padding:12px 22px;border-radius:22px;font-size:10px;font-weight:700;letter-spacing:1.5px;cursor:pointer}
#status{text-align:center;margin-top:18px;font-size:11px;letter-spacing:2px;opacity:.6;text-transform:uppercase;min-height:16px}
.results{max-width:580px;margin:16px auto;padding:0 14px;flex:1;width:100%}
.card{background:rgba(18,22,36,.85);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:14px;display:flex;gap:14px;margin-bottom:10px;backdrop-filter:blur(10px)}
.preview{background:rgba(18,22,36,.96);border:1px solid rgba(142,207,255,.25);border-radius:18px;overflow:hidden;margin-bottom:12px}
.preview video,.preview img.p{width:100%;max-height:540px;object-fit:contain;display:block;background:#000}
.info{padding:14px}
.btns{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.18);padding:7px 16px;border-radius:20px;font-size:10px;cursor:pointer}
.btn2{border-color:#8ecfff;color:#8ecfff;background:rgba(142,207,255,.12)}
.footer{margin-top:auto;text-align:center;padding:30px 0 20px;opacity:.35;font-size:10px}
</style>
</head>
<body>
<div class="h"><div><div class="logo"><span>Lexa</span> Download</div><div style="opacity:.4;font-size:9px;letter-spacing:3px;margin-top:2px">WEB FIX V5 NO ABOUT BLANK</div></div><div style="opacity:.35;font-size:9px">HD NO WM</div></div>
<div class="t">Lèxaa <span>Download</span></div>
<div class="sub">SPOTIFY • TIKTOK FOTO VIDEO • IG REELS POST • YT • HD NO WM</div>
<div class="box"><input id="q" placeholder="paste link ig / tiktok / yt / spotify..."><button onclick="handle()">DOWNLOAD</button></div>
<div id="status">web fix v5 • tanpa ddinsta • anti about:blank • anti blokir indo</div>
<div class="results" id="results"></div>
<div class="footer">© 2026 Lèxaa Download • Fix Web V5 - Tanpa DDInstagram</div>
<script>
const statusEl=document.getElementById('status'),resultsEl=document.getElementById('results');
function detect(u){u=u.toLowerCase();if(u.includes('tiktok'))return 'tiktok';if(u.includes('instagram'))return 'ig';if(u.includes('youtube')||u.includes('youtu.be'))return 'yt';if(u.includes('spotify'))return 'spotify';return 'search';}
function extractUrl(t){const m=t.match(/https?:\/\/[^\s]+/i);return m?m[0].replace(/[.,;!\)]+$/,'').trim():t.trim();}
async function handle(){
 const raw=document.getElementById('q').value.trim();if(!raw)return;
 const url=extractUrl(raw);document.getElementById('q').value=url;
 const t=detect(url);
 if(t==='search')searchSpotify(url);
 else if(t==='tiktok')dlTikTok(url);
 else if(t==='ig')dlIG_V5(url);
 else if(t==='yt')dlYT(url);
 else if(t==='spotify')searchSpotify(url);
}
async function searchSpotify(q){
 statusEl.innerText='searching...';resultsEl.innerHTML='';
 try{let r=await fetch('https://api.spotifydown.com/search/'+encodeURIComponent(q));let j=await r.json();if(j.success&&j.trackList.length){statusEl.innerText=j.trackList.length+' results';resultsEl.innerHTML=j.trackList.map(t=>`<div class="card"><div style="flex:1"><b>${t.title}</b><small>${t.artists}</small></div></div>`).join('');return;}}catch(e){}
}
async function dlTikTok(url){
 statusEl.innerText='tiktok • hd...';
 try{let r=await fetch('https://www.tikwm.com/api/?url='+encodeURIComponent(url)+'&hd=1');let j=await r.json();if(j.data){let d=j.data;if(d.images&&d.images.length){resultsEl.innerHTML=d.images.map((img,i)=>`<div class="preview"><img class="p" src="${img}"><div class="info"><b>Foto ${i+1} HD</b><div class="btns"><button class="btn btn2" onclick="downloadFile('${img}','foto_${i+1}.jpg')">DOWNLOAD JPG HD</button></div></div></div>`).join('');}else{resultsEl.innerHTML=`<div class="preview"><video class="p" src="${d.play}" poster="${d.cover}" controls playsinline></video><div class="info"><b>${d.title||'TikTok HD'}</b><div class="btns"><button class="btn btn2" onclick="downloadFile('${d.play}','tiktok_hd.mp4')">DOWNLOAD MP4 HD NO WM</button></div></div></div>`;}statusEl.innerText='tiktok • ready';return;}}catch(e){}
}
async function dlYT(url){
 statusEl.innerText='yt • hd...';
 try{let res=await fetch('https://co.wuk.sh/api/json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url,vQuality:'1080'})});let data=await res.json();if(data.url){resultsEl.innerHTML=`<div class="preview"><div class="info"><b>${data.filename||'YouTube HD'}</b><div class="btns"><button class="btn btn2" onclick="downloadFile('${data.url}','yt_hd.mp4')">DOWNLOAD MP4 HD</button></div></div></div>`;statusEl.innerText='yt • ready';return;}}catch(e){}
}
async function dlIG_V5(url){
 const igId=url.split('/p/')[1]?.split('/')[0]||url.split('/reel/')[1]?.split('/')[0]||url.split('/reels/')[1]?.split('/')[0]||url.split('/')[4]||'';
 statusEl.innerText='ig • wuk.sh hd (anti blokir)...';
 resultsEl.innerHTML=`<div class="card"><div style="flex:1"><b>IG • Fetching HD Direct...</b><small>${igId} • tanpa ddinsta.com • anti about:blank</small></div></div>`;
 try{
  let r=await fetch('https://co.wuk.sh/api/json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url,vQuality:'1080'})});
  let j=await r.json();
  if(j.url){
   const isV=j.url.includes('.mp4')||j.url.includes('video');
   statusEl.innerText=`ig ${isV?'reels':'post'} • hd ready • direct cdn`;
   resultsEl.innerHTML=`<div class="preview">${isV?`<video class="p" src="${j.url}" controls playsinline></video>`:`<img class="p" src="${j.url}">`}<div class="info"><b>IG ${isV?'Reels':'Post'} • HD NO WM • Direct</b><small>mp4=mp4 foto=foto hd • tanpa about:blank • tanpa ddinsta • anti blokir indo</small><div class="btns"><button class="btn btn2" style="width:100%;padding:12px" onclick="downloadFile('${j.url}','ig_${igId}_hd.${isV?'mp4':'jpg'}')">DOWNLOAD ${isV?'MP4':'JPG'} HD NO WM</button><button class="btn" onclick="window.open('${j.url}','_blank')">OPEN DIRECT HD</button></div></div></div>`;
   return;
  }
  if(j.picker&&j.picker.length){
   statusEl.innerText=`ig carousel • ${j.picker.length} files • hd`;
   resultsEl.innerHTML=j.picker.map((p,i)=>`<div class="preview">${p.type==='video'?`<video class="p" src="${p.url}" controls></video>`:`<img class="p" src="${p.url||p.thumb}">`}<div class="info"><b>File ${i+1} • HD No WM</b><div class="btns"><button class="btn btn2" onclick="downloadFile('${p.url}','ig_${i+1}_hd.${p.ext||'mp4'}')">DOWNLOAD HD NO WM</button></div></div></div>`).join('');
   return;
  }
 }catch(e){}
 statusEl.innerText='ig • fallback direct preview (no ddinsta)';
 resultsEl.innerHTML=`
 <div class="preview">
  <img class="p" src="https://instagram.com/p/${igId}/media/?size=l" onerror="this.src='bg.jpg'">
  <div class="info">
   <b>IG HD • Direct Preview (Tanpa DD)</b>
   <small>id: ${igId} • foto dari ig cdn langsung • tanpa ddinsta.com • anti about:blank • klik bawah untuk hd</small>
   <div class="btns" style="margin-top:12px">
     <button class="btn btn2" style="width:100%;padding:12px" onclick="window.open('https://instagram.com/p/${igId}/media/?size=l','_blank')">BUKA JPG HD DIRECT (TAP HOLD SAVE = HD)</button>
   </div>
   <div class="btns">
     <button class="btn btn2" onclick="window.open('https://snapinsta.app/?url=${encodeURIComponent(url)}','_blank')">SNAPINSTA HD</button>
     <button class="btn btn2" onclick="window.open('https://igram.world/?url=${encodeURIComponent(url)}','_blank')">IGRAM HD</button>
   </div>
  </div>
 </div>`;
}
function downloadFile(url,name){
 if(url.includes('.mp4')||url.includes('.jpg')||url.includes('scontent')||url.includes('fbcdn')){
   const a=document.createElement('a');a.href=url;a.download=name;a.target='_blank';document.body.appendChild(a);a.click();a.remove();
 }else{ window.open(url,'_blank'); }
 statusEl.innerText='downloaded • '+name;
}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')handle();});
</script>
</body>
</html>
