<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALDINO AKBAR</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070707;color:#fff;font-family:system-ui,sans-serif;overflow-x:hidden}
.hero{min-height:100vh;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px;position:relative}
.bg{position:absolute;inset:0;background:linear-gradient(180deg,#111,#070707);z-index:0}
.content{position:relative;z-index:1;width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;text-align:center}
.photo{width:100%;border-radius:32px;overflow:hidden;border:2px solid #FFD700;box-shadow:0 0 50px rgba(0,0,0,.8),0 0 20px rgba(255,215,0,.2);line-height:0}
.photo img{width:100%;display:block}
.name{margin-top:22px;font-family:'Syne';font-size:38px;font-weight:800;letter-spacing:-1px}
.badge{margin-top:8px;color:#FFD700;font-size:10px;letter-spacing:4px;border:1px solid rgba(255,215,0,.3);padding:6px 14px;border-radius:100px}
.btns{width:100%;margin-top:22px;display:flex;flex-direction:column;gap:10px}
.btn{width:100%;padding:15px;border-radius:100px;text-align:center;text-decoration:none;font-weight:800;font-size:13px;letter-spacing:1px}
.gold{background:#FFD700;color:#000}
.dark{background:#141414;color:#fff;border:1px solid #222}
.card{width:100%;margin-top:20px;background:#141414;border:1px solid #222;border-radius:20px;padding:18px;text-align:left}
.card b{color:#FFD700;font-size:10px;letter-spacing:2px}
.card p{font-size:18px;font-weight:700;margin-top:6px}
.card span{color:#666;font-size:12px;margin-top:6px;display:block}
</style>
</head>
<body>
<div class="hero">
<div class="bg"></div>
<div class="content">
<div class="photo"><img src="avatar.jpg" alt="Aldino"></div>
<div class="badge">PORTFOLIO • STARBOY • 2024</div>
<div class="name">ALDINO AKBAR</div>
<div class="btns">
<a class="btn gold" href="https://instagram.com/alaaxaa_" target="_blank">INSTAGRAM</a>
<a class="btn dark" href="https://tiktok.com/@alaaxaa_" target="_blank">TIKTOK</a>
</div>
<div class="card">
<b>SKILL</b>
<p>Membuat Bot WhatsApp</p>
<span>Baileys • Node.js • Auto System 24/7 • Full Script Pro</span>
</div>
</div>
</div>
</body>
</html>
