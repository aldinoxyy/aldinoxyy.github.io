<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lexa Download - HD No WM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;background:#05070d;color:#e8e8e8;font-family:'Inter',system-ui;background-image:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.9)),url('bg.jpg');background-size:cover;background-position:center;background-attachment:fixed}
.h{padding:16px 20px;display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.06);backdrop-filter:blur(10px)}
.logo{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:24px}.logo span{color:#8ecfff}
.t{margin-top:30px;text-align:center;font-family:'Cormorant Garamond',serif;font-size:42px;font-weight:600}.t span{color:#8ecfff}
.sub{text-align:center;opacity:.35;letter-spacing:5px;font-size:10px;margin-top:6px}
.box{margin:26px auto;max-width:560px;width:90%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:28px;display:flex;align-items:center;padding:0 6px 0 18px;backdrop-filter:blur(14px)}
.box input{flex:1;background:transparent;border:none;outline:none;color:#fff;padding:16px 10px;font-size:13px}
.box button{background:#8ecfff;color:#000;border:none;padding:12px 22px;border-radius:22px;font-size:10px;font-weight:700;letter-spacing:1.5px;cursor:pointer}
#status{text-align:center;margin-top:18px;font-size:11px;letter-spacing:2px;opacity:.6;text-transform:uppercase;min-height:16px}
.results{max-width:580px;margin:16px auto;padding:0 14px;flex:1;width:100%}
.card{background:rgba(18,22,36,.85);border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:14px;display:flex;gap:14px;margin-bottom:10px;backdrop-filter:blur(10px)}
.card img{width:62px;height:62px;border-radius:12px;object-fit:cover}
.card b{font-size:14px;font-weight:500;display:block}
.card small{opacity:.45;font-size:11.5px;display:block;margin-top:3px}
.btns{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.18);padding:7px 18px;border-radius:20px;font-size:10.5px;letter-spacing:1px;cursor:pointer}
.btn2{border-color:rgba(142,207,255,.5);color:#8ecfff;background:rgba(142,207,255,.1)}
.preview{background:rgba(18,22,36,.96);border:1px solid rgba(142,207,255,.25);border-radius:22px;overflow:hidden;margin-bottom:12px}
.preview img.p{width:100%;max-height:580px;object-fit:contain;display:block;background:#000}
.info{padding:18px;text-align:center}
.info b.by{display:block;font-size:13px;font-weight:600;letter-spacing:1px;margin-bottom:12px}
.btn-download{width:100%;background:#8ecfff;color:#000;border:none;padding:14px;border-radius:14px;font-size:13px;font-weight:700;letter-spacing:1px;cursor:pointer;margin-top:6px}
.footer{margin-top:auto;text-align:center;padding:30px 0 20px;opacity:.35;font-size:10px}
</style>
</head>
<body>
<div class="h"><div><div class="logo"><span>Lexa</span> Download</div><div style="opacity:.4;font-size:9px;letter-spacing:3px;margin-top:2px">SPOTIFY ANTI BLOKIR V2</div></div><div style="opacity:.35;font-size:9px">HD NO WM</div></div>
<div class="t">Lèxaa <span>Download</span></div>
<div class="sub">SPOTIFY • TIKTOK • IG • YT • HD NO WM</div>
<div class="box"><input id="q" placeholder="paste link spotify / ig / tiktok..."><button onclick="handle()">DOWNLOAD</button></div>
<div id="status">spotify anti blokir • ig simple • tiktok foto 1 jpg hd</div>
<div class="results" id="results"></div>
<div class="footer">© 2026 download by LèxaaMj</div>
<script>
const statusEl=document.getElementById('status'),resultsEl=document.getElementById('results');
function detect(u){u=u.toLowerCase();if(u.includes('tiktok'))return 'tiktok';if(u.includes('instagram'))return 'ig';if(u.includes('youtube')||u.includes('youtu.be'))return 'yt';if(u.includes('spotify'))return 'spotify';return 'search';}
function extractUrl(t){const m=t.match(/https?:\/\/[^\s]+/i);return m?m[0].replace(/[.,;!\)]+$/,'').trim():t.trim();}
function getSpotifyId(url){let m=url.match(/track\/([a-zA-Z0-9]+)/);return m?m[1]:null;}
async function handle(){
 const raw=document.getElementById('q').value.trim();if(!raw)return;
 const url=extractUrl(raw);
 const t=detect(url);
 if(t==='search')searchSpotify(raw);
 else if(t==='tiktok')dlTikTok(url);
 else if(t==='ig')dlIG(url);
 else if(t==='yt')dlYT(url);
 else if(t==='spotify')searchSpotify(raw);
}
async function fetchWithProxy(url){
 // coba 3 cara: direct, allorigins, corsproxy
 const proxies=['','https://api.allorigins.win/get?url=','https://corsproxy.io/?'];
 for(let p of proxies){
  try{
   let full=p===''?url:(p.includes('allorigins')?p+encodeURIComponent(url):p+encodeURIComponent(url));
   let r=await fetch(full,{timeout:10000});
   if(!r.ok) continue;
   if(p.includes('allorigins')){
    let j=await r.json(); return JSON.parse(j.contents);
   }else{
    let j=await r.json(); return j;
   }
  }catch(e){ continue; }
 }
 throw new Error('all proxy fail');
}

async function searchSpotify(q){
 resultsEl.innerHTML='';
 let spotifyId=getSpotifyId(q);
 let isLink=!!spotifyId;

 if(isLink){
  statusEl.innerText='spotify • anti blokir • fetching id '+spotifyId+'...';
  resultsEl.innerHTML=`<div class="card"><div style="flex:1"><b>Spotify • Fetching HD...</b><small>${spotifyId} • anti blokir indo • 3 servers</small></div></div>`;

  // 1. coba oembed dulu buat dapet judul (ini gak pernah diblokir)
  let title='Spotify Track', artist='Spotify';
  try{
   let oembed=await fetch(`https://open.spotify.com/oembed?url=https://open.spotify.com/track/${spotifyId}`).then(r=>r.json());
   title=oembed.title||title;
   // title biasanya "Artist - Song"
   if(title.includes(' - ')){let parts=title.split(' - '); artist=parts[0]; title=parts.slice(1).join(' - ');}
   statusEl.innerText=`spotify • ${title} • fetching mp3...`;
  }catch(e){}

  // 2. coba api.spotifydown.com via proxy
  try{
   let j=await fetchWithProxy(`https://api.spotifydown.com/download/${spotifyId}`);
   if(j.success&&j.link){
    statusEl.innerText='spotify • mp3 original ready • hd audio';
    resultsEl.innerHTML=`
    <div class="card">
      <img src="${j.metadata?.cover||''}" onerror="this.src='bg.jpg'">
      <div style="flex:1">
        <b>${j.metadata?.title||title} • MP3 Original</b>
        <small>${j.metadata?.artists||artist} • mp3 = mp3 • hd audio</small>
        <div class="btns"><button class="btn btn2" onclick="downloadFile('${j.link}','${(j.metadata?.title||title).replace(/'/g,'')}.mp3')">DOWNLOAD MP3</button></div>
      </div>
    </div>`;
    return;
   }
  }catch(e){ console.log('spotifydown proxy fail',e); }

  // 3. fallback: metadata dulu
  try{
   let j=await fetchWithProxy(`https://api.spotifydown.com/metadata/track/${spotifyId}`);
   if(j.success||j.title){
    let t=j.title||title;
    let a=j.artists||artist;
    let c=j.cover||'';
    statusEl.innerText='spotify • metadata ok • getting mp3...';
    resultsEl.innerHTML=`
    <div class="card">
      <img src="${c}" onerror="this.src='bg.jpg'">
      <div style="flex:1">
        <b>${t} • MP3 Original</b>
        <small>${a} • mp3 = mp3 • hd audio</small>
        <div class="btns"><button class="btn btn2" onclick="dlSpotifyId('${spotifyId}','${t.replace(/'/g,'')}')">DOWNLOAD MP3</button></div>
      </div>
    </div>`;
    // auto fetch mp3
    dlSpotifyId(spotifyId,t);
    return;
   }
  }catch(e){}

  // 4. LAST FALLBACK: pake oembed title + tombol download via youtube search (wuk.sh)
  statusEl.innerText='spotify • fallback • ready';
  resultsEl.innerHTML=`
  <div class="card">
    <img src="bg.jpg">
    <div style="flex:1">
      <b>${title} • MP3 Original</b>
      <small>${artist} • mp3 = mp3 • hd audio • via fallback</small>
      <div class="btns">
        <button class="btn btn2" onclick="dlSpotifyId('${spotifyId}','${title.replace(/'/g,'')}')">DOWNLOAD MP3 (TRY SERVER 1)</button>
        <button class="btn" onclick="window.open('https://spotifydown.com/?url=https://open.spotify.com/track/${spotifyId}','_blank')">BUKA DI SPOTIFYDOWN.COM</button>
      </div>
    </div>
  </div>`;
  return;
 }

 // SEARCH JUDUL
 statusEl.innerText='spotify • searching '+q+'...';
 try{
  let j=await fetchWithProxy('https://api.spotifydown.com/search/'+encodeURIComponent(q));
  if(j.success&&j.trackList&&j.trackList.length){
   statusEl.innerText=`spotify • ${j.trackList.length} results • hd audio`;
   resultsEl.innerHTML=j.trackList.map(t=>`
    <div class="card">
      <img src="${t.cover}">
      <div style="flex:1">
        <b>${t.title} • MP3 Original</b>
        <small>${t.artists} • mp3 = mp3 • hd audio</small>
        <div class="btns"><button class="btn btn2" onclick="dlSpotifyId('${t.id}','${t.title.replace(/'/g,'')}')">DOWNLOAD MP3</button></div>
      </div>
    </div>`).join('');
   return;
  }
 }catch(e){ console.log('search fail',e); }

 // kalo search gagal, coba oembed search? fallback ke pesan
 statusEl.innerText='spotify • coba paste link track langsung';
 resultsEl.innerHTML=`<div class="card"><div style="flex:1"><b>Spotify gak ketemu via API (diblokir provider?)</b><small>Coba paste link track langsung: https://open.spotify.com/track/... atau buka manual <a href="https://spotifydown.com/" target="_blank" style="color:#8ecfff">spotifydown.com</a> terus paste link di sana, kalo udah coba lagi di sini</small><div class="btns"><button class="btn btn2" onclick="window.open('https://spotifydown.com/','_blank')">BUKA SPOTIFYDOWN.COM</button></div></div></div>`;
}
async function dlSpotifyId(id,title){
 statusEl.innerText='spotify • downloading '+title+'...';
 try{
  let j=await fetchWithProxy('https://api.spotifydown.com/download/'+id);
  if(j.success&&j.link){
   downloadFile(j.link,title+'.mp3');
   statusEl.innerText='spotify • downloaded • hd audio';
   return;
  }
 }catch(e){}
 // fallback buka spotifydown.com
 statusEl.innerText='spotify • server sibuk, buka spotifydown.com';
 window.open('https://spotifydown.com/?url=https://open.spotify.com/track/'+id,'_blank');
}
async function dlSpotify(id,title){ dlSpotifyId(id,title); }

async function dlTikTok(url){
 statusEl.innerText='tiktok • hd...';
 resultsEl.innerHTML=`<div class="card"><div style="flex:1"><b>Fetching TikTok HD...</b><small>@ofcsilent • foto = foto hd</small></div></div>`;
 try{
  let r=await fetch('https://www.tikwm.com/api/?url='+encodeURIComponent(url)+'&hd=1');
  let j=await r.json();
  if(j.data){
   let d=j.data;
   let author=d.author?.unique_id?`@${d.author.unique_id}`:'@ofcsilent';
   if(d.images&&d.images.length){
    statusEl.innerText=`tiktok • ${d.images.length} foto • hd no wm`;
    let musicBtn=d.music?`<div class="card"><div style="flex:1"><b>Music • MP3 Original</b><small>mp3 = mp3 • hd audio</small><div class="btns"><button class="btn btn2" onclick="downloadFile('${d.music}','tiktok_music.mp3')">DOWNLOAD MP3</button></div></div></div>`:'';
    resultsEl.innerHTML=d.images.map((img,i)=>`
      <div class="card">
        <img src="${img}">
        <div style="flex:1">
          <b>Foto ${i+1} • JPG HD No WM</b>
          <small>${author} • foto = foto hd</small>
          <div class="btns"><button class="btn btn2" onclick="downloadFile('${img}','foto_${i+1}_hd.jpg')">DOWNLOAD JPG HD</button></div>
        </div>
      </div>`).join('')+musicBtn;
   }else{
    statusEl.innerText='tiktok • video hd • no wm';
    resultsEl.innerHTML=`
      <div class="card">
        <img src="${d.cover}">
        <div style="flex:1">
          <b>Video • MP4 HD No WM</b>
          <small>${author} • mp4 = mp4 hd • no wm</small>
          <div class="btns"><button class="btn btn2" onclick="downloadFile('${d.play}','tiktok_hd_no_wm.mp4')">DOWNLOAD MP4 HD</button></div>
        </div>
      </div>`;
   }
   return;
  }
 }catch(e){}
}
async function dlYT(url){
 statusEl.innerText='yt • hd...';
 try{let res=await fetch('https://co.wuk.sh/api/json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url,vQuality:'1080'})});let data=await res.json();if(data.url){resultsEl.innerHTML=`<div class="card"><div style="flex:1"><b>Video • MP4 HD</b><small>yt • mp4 = mp4 hd</small><div class="btns"><button class="btn btn2" onclick="downloadFile('${data.url}','yt_hd.mp4')">DOWNLOAD MP4 HD</button></div></div></div>`;statusEl.innerText='yt • ready';return;}}catch(e){}
}
async function dlIG(url){
 const igId=url.split('/p/')[1]?.split('/')[0]||url.split('/reel/')[1]?.split('/')[0]||url.split('/reels/')[1]?.split('/')[0]||url.split('/')[4]||'';
 statusEl.innerText='ig • fetching hd...';
 resultsEl.innerHTML=`<div class="preview"><div class="info"><b class="by">download by LèxaaMj</b><small>fetching...</small></div></div>`;
 try{
  let r=await fetch('https://co.wuk.sh/api/json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url,vQuality:'1080'})});
  let j=await r.json();
  if(j.url){
   const isV=j.url.includes('.mp4')||j.url.includes('video');
   resultsEl.innerHTML=`<div class="preview">${isV?`<video class="p" src="${j.url}" controls playsinline></video>`:`<img class="p" src="${j.url}">`}<div class="info"><b class="by">download by LèxaaMj</b><button class="btn-download" onclick="downloadFile('${j.url}','ig_${igId}_hd.${isV?'mp4':'jpg'}')">Download</button></div></div>`;
   statusEl.innerText='ig • hd ready • download by LèxaaMj';
   return;
  }
  if(j.picker&&j.picker.length){
   resultsEl.innerHTML=j.picker.map((p,i)=>`<div class="preview">${p.type==='video'?`<video class="p" src="${p.url}" controls></video>`:`<img class="p" src="${p.url||p.thumb}">`}<div class="info"><b class="by">download by LèxaaMj</b><button class="btn-download" onclick="downloadFile('${p.url}','ig_${i+1}_hd.${p.ext||'mp4'}')">Download</button></div></div>`).join('');
   return;
  }
 }catch(e){}
 resultsEl.innerHTML=`<div class="preview"><img class="p" src="https://instagram.com/p/${igId}/media/?size=l" onerror="this.src='bg.jpg'"><div class="info"><b class="by">download by LèxaaMj</b><button class="btn-download" onclick="downloadFile('https://instagram.com/p/${igId}/media/?size=l','ig_${igId}_hd.jpg')">Download</button></div></div>`;
}
function downloadFile(url,name){
 const a=document.createElement('a');a.href=url;a.download=name;a.target='_blank';document.body.appendChild(a);a.click();a.remove();statusEl.innerText='downloaded • '+name;
}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')handle();});
</script>
</body>
</html>
