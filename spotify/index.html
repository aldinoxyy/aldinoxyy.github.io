<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spotify LèxaaMj - Angelic Player</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
body{background:#05070d;color:#fff;min-height:100vh;position:relative}
body::before{content:'';position:fixed;inset:0;background:url('bg.jpg') center top/cover no-repeat;filter:brightness(0.35);z-index:-2}
body::after{content:'';position:fixed;inset:0;background:linear-gradient(180deg,rgba(5,7,13,0.2) 0%,rgba(5,7,13,0.9) 80%);z-index:-1}
header{padding:18px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,0.08);backdrop-filter:blur(12px)}
.logo{font-weight:900;font-size:18px}.logo b{color:#6cf}.logo span{display:block;font-size:10px;letter-spacing:3px;color:#8a90a8;font-weight:400}
.search-box{max-width:700px;margin:30px auto;padding:0 20px}
.search-input{width:100%;background:rgba(255,255,255,0.07);border:1px solid rgba(102,204,255,0.25);border-radius:18px;padding:16px 20px 16px 48px;color:#fff;font-size:15px;outline:none;backdrop-filter:blur(12px)}
.search-input:focus{border-color:#6cf;box-shadow:0 0 20px rgba(102,204,255,0.2)}
.wrap{position:relative}.wrap::before{content:'⌕';position:absolute;left:18px;top:50%;transform:translateY(-50%);color:#6cf;font-size:20px}
.hero{text-align:center;margin-top:10px}
.hero h1{font-size:34px;font-weight:900;background:linear-gradient(90deg,#fff,#6cf);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:#8a90a8;font-size:12px;letter-spacing:2px;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px;padding:20px;max-width:900px;margin:10px auto}
.card{background:rgba(18,21,31,0.75);border:1px solid rgba(255,255,255,0.08);border-radius:18px;padding:12px;cursor:pointer;transition:.3s;backdrop-filter:blur(12px)}
.card:hover{transform:translateY(-4px);border-color:#6cf;box-shadow:0 10px 30px rgba(102,204,255,0.15)}
.card img{width:100%;border-radius:12px;aspect-ratio:1/1;object-fit:cover}
.card h3{font-size:13px;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small{color:#8a90a8;font-size:11px}
.player{position:fixed;bottom:0;left:0;right:0;background:rgba(10,12,19,0.95);border-top:1px solid rgba(255,255,255,0.1);backdrop-filter:blur(20px);padding:14px 20px;display:none;align-items:center;gap:14px;z-index:99}
.player.show{display:flex}
.player img{width:54px;height:54px;border-radius:10px}
.info{flex:1;overflow:hidden}.info b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info span{font-size:11px;color:#8a90a8}
.btn{padding:10px 16px;border-radius:10px;border:none;font-weight:700;cursor:pointer;font-size:12px}
.btn-play{background:#6cf;color:#000}.btn-down{background:#1a1e2a;color:#fff;border:1px solid #2a2e3a}
footer{text-align:center;padding:80px 20px 110px;color:#5a5f72;font-size:12px;line-height:1.8;border-top:1px solid rgba(255,255,255,0.06);margin-top:30px}
footer a{color:#6cf;text-decoration:none}
.empty{text-align:center;color:#5a5f72;padding:50px 20px}
</style>
</head>
<body>
<header><div class="logo"><b>Spotify</b> LèxaaMj <span>ANGELIC EDITION</span></div><div style="font-size:10px;color:#6b7085">PERMANENT</div></header>
<div class="hero"><h1>Spotify LèxaaMj</h1><p>SEARCH • PLAY • DOWNLOAD</p></div>
<div class="search-box"><div class="wrap"><input id="q" class="search-input" placeholder="Ketik judul lagu... misal: tentang rindu, die with a smile"></div></div>
<div id="empty" class="empty">Ketik lagu di atas Bosku ✨<br>Langsung muncul, klik langsung muter & bisa diunduh</div>
<div id="results" class="grid"></div>
<div id="player" class="player">
<img id="p-img" src="">
<div class="info"><b id="p-title">-</b><span id="p-artist">-</span><audio id="audio" style="width:100%;margin-top:6px" controls></audio></div>
<div style="display:flex;gap:8px"><button class="btn btn-down" onclick="download()">Download</button></div>
</div>
<footer>© 2026 Spotify LèxaaMj • Angelic Edition<br>Instagram: @alaaxaa_ | Bug / Error: <a href="https://wa.me/6285642367261?text=Halo%20LèxaaMj%20web%20spotify%20ada%20bug">085642367261</a><br><span style="color:#2a2e3a">Permanent • No Server • Fast</span></footer>
<script>
let cur=null;
const q=document.getElementById('q'), resDiv=document.getElementById('results'), empty=document.getElementById('empty'), player=document.getElementById('player'), audio=document.getElementById('audio');

q.addEventListener('input', async()=>{
  let val=q.value.trim(); if(val.length<2){resDiv.innerHTML='';empty.style.display='block';return}
  empty.style.display='none'; resDiv.innerHTML='<div style="grid-column:1/-1;text-align:center;color:#6cf">Searching...</div>';
  try{
    // Pake Piped API (public, permanen, ga perlu API key) - sama kayak yt-dlp search di index.js lu
    let r=await fetch(`https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(val)}&filter=music_songs`);
    let j=await r.json();
    let items=j.items||[];
    if(!items.length){ // fallback filter all
      let r2=await fetch(`https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(val)}`);
      let j2=await r2.json(); items=j2.items||[];
    }
    let list=items.filter(x=>x.type==='stream').slice(0,12).map(x=>({
      id:x.url.split('v=')[1]||x.url.split('/').pop(),
      title:x.title,
      artist:x.uploaderName,
      img:x.thumbnail,
      url:x.url
    }));
    show(list);
  }catch(e){
    resDiv.innerHTML='<div style="grid-column:1/-1;text-align:center;color:#ff6a7a">Error search, coba lagi Bos</div>';
  }
});

function show(list){
  if(!list.length){resDiv.innerHTML='<div style="grid-column:1/-1;text-align:center;color:#5a5f72">Ga ketemu Bos</div>';return}
  resDiv.innerHTML='';
  list.forEach(s=>{
    let el=document.createElement('div'); el.className='card';
    el.innerHTML=`<img src="${s.img}"><h3>${s.title}</h3><small>${s.artist}</small>`;
    el.onclick=()=>playSong(s); resDiv.appendChild(el);
  });
}

async function playSong(s){
  cur=s;
  document.getElementById('p-img').src=s.img;
  document.getElementById('p-title').innerText=s.title;
  document.getElementById('p-artist').innerText=s.artist;
  player.classList.add('show');
  document.getElementById('empty').innerHTML='Loading audio...';
  try{
    let r=await fetch(`https://pipedapi.kavin.rocks/streams/${s.id}`);
    let j=await r.json();
    let audioStream = (j.audioStreams||[]).sort((a,b)=>b.bitrate-a.bitrate)[0];
    if(audioStream){ audio.src=audioStream.url; audio.play(); }
  }catch(e){ /* fallback youtube embed */ }
}

function download(){
  if(!cur) return;
  // pake link Piped buat download, permanen
  window.open(`https://pipedapi.kavin.rocks/streams/${cur.id}`, '_blank');
  // alternatif download cepat:
  // window.open(`https://api.vevioz.com/api/button/mp3/${cur.id}`, '_blank');
}
</script>
</body>
</html>
