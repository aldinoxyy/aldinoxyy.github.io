<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
<style>body{background:#05070d;color:#fff;font-family:'Inter';min-height:100vh;background-image:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.9)),url('../spotify/bg.jpg');background-size:cover}.card{max-width:500px;margin:20px auto;background:rgba(18,22,36,.9);border-radius:20px;padding:20px;border:1px solid rgba(255,255,255,.08)} input{width:100%;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#fff;margin:8px 0;outline:none}.btn{width:100%;padding:14px;border-radius:12px;border:none;background:#8ecfff;color:#000;font-weight:700;cursor:pointer;margin-top:8px}.code{font-size:32px;letter-spacing:6px;text-align:center;margin:16px 0;color:#8ecfff;font-family:'Cormorant Garamond';display:none}.menu{margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.08);display:none}#cloudStat{font-size:10px;text-align:center;letter-spacing:2px;opacity:.6;margin-bottom:10px}</style>
</head><body>
<div style="text-align:center;padding:20px;font-family:'Cormorant Garamond';font-size:28px">Panel <span style="color:#8ecfff">LèxaaMj</span></div>
<div class="card">
<div id="cloudStat">● CONNECTING CLOUD...</div>
<h3 style="font-weight:300;letter-spacing:3px;font-size:11px;opacity:.5">LOGIN BUYER</h3>
<input id="user" placeholder="username buyer1">
<input id="pass" type="password" placeholder="password lexa123">
<input id="nomor" placeholder="628xxxxxxxx (jangan 08)">
<button class="btn" onclick="mintaKode()">MINTA KODE 8 DIGIT</button>
<div class="code" id="kode">-</div>
<div id="status" style="text-align:center;font-size:11px;letter-spacing:1px;opacity:.7;margin-top:10px">isi data dulu</div>
<div class="menu" id="menuBox">
<h3 style="font-weight:300;letter-spacing:3px;font-size:11px;opacity:.5">MENU BOT - SUDAH CONNECT</h3>
<div style="background:rgba(142,207,255,.1);border:1px solid #8ecfff33;padding:12px;border-radius:12px;margin-bottom:12px">
<input id="q" placeholder="cari lagu spotify...">
<button class="btn" style="background:transparent;border:1px solid #8ecfff;color:#8ecfff" onclick="searchSpotify()">SEARCH & DOWNLOAD</button>
<div id="results" style="margin-top:12px"></div>
</div>
<button style="width:100%;padding:10px;opacity:.3;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#fff;border-radius:10px;margin:4px 0">📤 Bot Pushkontak [SOON]</button>
<button style="width:100%;padding:10px;opacity:.3;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#fff;border-radius:10px;margin:4px 0">🐛 Bot Bug [SOON]</button>
</div>
</div>
<script>
const NPOINT_ID = "aab1330f806769a8d485";
const NPOINT_URL = `https://api.npoint.io/${NPOINT_ID}`;
async function checkCloud(){
 try{
   let r = await fetch(NPOINT_URL);
   let j = await r.json();
   document.getElementById('cloudStat').innerText = `● CLOUD ACTIVE - ${j.lex_users?.length||0} USERS`;
 }catch(e){
   document.getElementById('cloudStat').innerText = '● CLOUD OFFLINE';
 }
}
checkCloud();
async function mintaKode(){
  let u=document.getElementById('user').value.trim();
  let p=document.getElementById('pass').value.trim();
  let n=document.getElementById('nomor').value.trim();
  if(!u||!p||!n) return alert('isi semua dulu bos');
  if(n.startsWith('08')) n='62'+n.substring(1);
  if(n.startsWith('0')) n='62'+n.substring(1);
  document.getElementById('nomor').value=n;
  document.getElementById('status').innerText='checking cloud user...';
  document.getElementById('kode').style.display='none';
  try{
    let c = await fetch(NPOINT_URL);
    let cj = await c.json();
    let f = (cj.lex_users||[]).find(x=>x.username==u && x.password==p);
    if(!f){
      document.getElementById('status').innerText='❌ Username / Password Salah';
      document.getElementById('status').style.color='#ff6b6b';
      return;
    }
    if(!f.isUnlimited && f.expiredAt && new Date(f.expiredAt) < new Date()){
      document.getElementById('status').innerText='❌ Akun Expired';
      document.getElementById('status').style.color='#ff6b6b';
      return;
    }
    let myService = localStorage.getItem('lex_service')||'spotify';
    let cek = (cj.lex_reqs||[]).find(x=>{
      let p1 = (x.phone||'').replace(/[^0-9]/g,'').slice(-10);
      let p2 = n.replace(/[^0-9]/g,'').slice(-10);
      return (p1===p2 || x.username===u) && (x.service||'spotify')===myService && x.status==='connected';
    });
    if(cek){
      document.getElementById('status').innerText='❌ Menu '+myService.toUpperCase()+' masih CONNECTED';
      document.getElementById('status').style.color='#ff6b6b';
      return;
    }
    document.getElementById('status').innerText='bikin kode & simpen ke cloud...';
    let pairingCode = Math.random().toString(36).substring(2,10).toUpperCase();
    let newReq = {username:u, phone:n, targetNumber:n, service:myService, code:pairingCode, pairingCode:pairingCode, status:'pending', timeAgo:new Date().toLocaleTimeString(), createdAt:new Date().toISOString()};
    cj.lex_reqs = cj.lex_reqs||[];
    cj.lex_reqs.unshift(newReq);
    let save = await fetch(NPOINT_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cj)});
    if(save.ok){
      localStorage.setItem('lex_nomor',n);
      localStorage.setItem('lex_user',u);
      document.getElementById('kode').style.display='block';
      document.getElementById('kode').innerText=pairingCode;
      document.getElementById('status').innerText='✅ KODE DAPAT! Sudah masuk antrian cloud';
      document.getElementById('status').style.color='#8ecfff';
      document.getElementById('menuBox').style.display='block';
    }
  }catch(e){
    document.getElementById('status').innerText='❌ Cloud error';
  }
}
async function searchSpotify(){
  let q=document.getElementById('q').value; if(!q) return;
  document.getElementById('results').innerHTML='searching...';
  let r=await fetch('https://api.spotifydown.com/search/'+encodeURIComponent(q));
  let j=await r.json();
  if(j.success){
    document.getElementById('results').innerHTML=j.trackList.slice(0,5).map(t=>`<div style="display:flex;gap:10px;margin:10px 0;background:rgba(255,255,255,.05);padding:10px;border-radius:12px"><img src="${t.cover}" style="width:50px;height:50px;border-radius:8px"><div><b style="font-size:12px">${t.title}</b><br><small style="opacity:.5">${t.artists}</small><br><a href="https://api.spotifydown.com/download/${t.id}" target="_blank" style="color:#8ecfff;font-size:11px">download full</a></div></div>`).join('');
  }
}
</script></body></html>
