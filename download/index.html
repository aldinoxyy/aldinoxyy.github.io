<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lexa Download - HD No WM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;background:#05070d;color:#e8e8e8;font-family:'Inter',system-ui;background-image:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.9)),url('bg.jpg');background-size:cover;background-position:center;background-attachment:fixed}
.h{padding:16px 20px;display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.06);backdrop-filter:blur(10px)}
.logo{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:24px}.logo span{color:#8ecfff}
.t{margin-top:30px;text-align:center;font-family:'Cormorant Garamond',serif;font-size:42px;font-weight:600}.t span{color:#8ecfff}
.sub{text-align:center;opacity:.35;letter-spacing:5px;font-size:10px;margin-top:6px}
.box{margin:26px auto;max-width:560px;width:90%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:28px;display:flex;align-items:center;padding:0 6px 0 18px;backdrop-filter:blur(14px)}
.box input{flex:1;background:transparent;border:none;outline:none;color:#fff;padding:16px 10px;font-size:13px}
.box button{background:#8ecfff;color:#000;border:none;padding:12px 22px;border-radius:22px;font-size:10px;font-weight:700;letter-spacing:1.5px;cursor:pointer}
#status{text-align:center;margin-top:18px;font-size:11px;letter-spacing:2px;opacity:.6;text-transform:uppercase;min-height:16px}
.results{max-width:580px;margin:16px auto;padding:0 14px;flex:1;width:100%}
.card{background:rgba(18,22,36,.78);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:14px;display:flex;gap:14px;margin-bottom:10px;backdrop-filter:blur(10px)}
.card img{width:62px;height:62px;border-radius:10px;object-fit:cover}
.card b{font-size:13.5px;font-weight:500;display:block}
.card small{opacity:.45;font-size:11px;display:block;margin-top:2px}
.btns{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.18);padding:6px 16px;border-radius:20px;font-size:10px;letter-spacing:1px;cursor:pointer}
.btn2{border-color:rgba(142,207,255,.4);color:#8ecfff;background:rgba(142,207,255,.1)}
.preview{background:rgba(18,22,36,.92);border:1px solid rgba(142,207,255,.25);border-radius:18px;overflow:hidden;margin-bottom:12px}
.preview video,.preview img.p{width:100%;max-height:520px;object-fit:cover;display:block;background:#000}
.info{padding:14px}
.footer{margin-top:auto;text-align:center;padding:30px 0 20px;opacity:.35;font-size:10px;letter-spacing:1.5px}
</style>
</head>
<body>
<div class="h"><div><div class="logo"><span>Spotify</span> LèxaaMj</div><div style="opacity:.4;font-size:9px;letter-spacing:3px;margin-top:2px">IG ANTI BACKUP V2</div></div><div style="opacity:.35;font-size:9px">HD NO WM</div></div>
<div class="t">Lèxaa <span>Download</span></div>
<div class="sub">SPOTIFY • TIKTOK FOTO VIDEO • IG REELS POST • YT • HD NO WM</div>
<div class="box"><input id="q" placeholder="paste link ig / tiktok / yt / spotify..."><button onclick="handle()">DOWNLOAD</button></div>
<div id="status">ig anti backup • dd + imginn + wuk • hd no wm</div>
<div class="results" id="results"></div>
<div class="footer">© 2026 Lèxaa Download • IG Anti Backup Edition<br>background same as spotify</div>
<script>
const statusEl=document.getElementById('status'),resultsEl=document.getElementById('results');
function detect(u){u=u.toLowerCase();if(u.includes('tiktok'))return 'tiktok';if(u.includes('instagram'))return 'ig';if(u.includes('youtube')||u.includes('youtu.be'))return 'yt';if(u.includes('spotify'))return 'spotify';return 'search';}
function extractUrl(t){const m=t.match(/https?:\/\/[^\s]+/i);return m?m[0].replace(/[.,;!\)]+$/,'').trim():t.trim();}
async function handle(){
 const raw=document.getElementById('q').value.trim();if(!raw)return;
 const url=extractUrl(raw);document.getElementById('q').value=url;
 const t=detect(url);
 if(t==='search')searchSpotify(url);
 else if(t==='tiktok')dlTikTok(url);
 else if(t==='ig')dlIG(url);
 else if(t==='yt')dlYT(url);
 else if(t==='spotify')searchSpotify(url);
}
async function searchSpotify(q){
 statusEl.innerText='searching spotify...';resultsEl.innerHTML='';
 try{let r=await fetch('https://api.spotifydown.com/search/'+encodeURIComponent(q));let j=await r.json();if(j.success&&j.trackList.length){statusEl.innerText=j.trackList.length+' results';resultsEl.innerHTML=j.trackList.map(t=>`<div class="card"><img src="${t.cover}"><div style="flex:1"><b>${t.title}</b><small>${t.artists}</small><div class="btns"><button class="btn btn2" onclick="dlSpotify('${t.id}','${t.title.replace(/'/g,'')}')">download mp3 hd</button></div></div></div>`).join('');return;}}catch(e){}
}
async function dlSpotify(id,title){try{let r=await fetch('https://api.spotifydown.com/download/'+id);let j=await r.json();if(j.success&&j.link){downloadFile(j.link,title+'.mp3');return;}}catch(e){}}
async function dlTikTok(url){
 statusEl.innerText='tiktok • hd...';
 try{let r=await fetch('https://www.tikwm.com/api/?url='+encodeURIComponent(url)+'&hd=1');let j=await r.json();if(j.data){let d=j.data;if(d.images&&d.images.length){resultsEl.innerHTML=d.images.map((img,i)=>`<div class="card"><img src="${img}"><div style="flex:1"><b>Foto ${i+1} HD</b><div class="btns"><button class="btn btn2" onclick="downloadFile('${img}','foto_${i+1}.jpg')">DOWNLOAD JPG HD</button></div></div></div>`).join('');}else{resultsEl.innerHTML=`<div class="preview"><video class="p" src="${d.play}" poster="${d.cover}" controls></video><div class="info"><b>${d.title||'TikTok HD'}</b><div class="btns"><button class="btn btn2" onclick="downloadFile('${d.play}','tiktok_hd.mp4')">DOWNLOAD MP4 HD NO WM</button></div></div></div>`;}statusEl.innerText='tiktok • ready';return;}}catch(e){}
}
async function dlYT(url){
 statusEl.innerText='yt • hd...';
 try{let res=await fetch('https://co.wuk.sh/api/json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url,vQuality:'1080'})});let data=await res.json();if(data.url){resultsEl.innerHTML=`<div class="preview"><div class="info"><b>${data.filename||'YouTube HD'}</b><div class="btns"><button class="btn btn2" onclick="downloadFile('${data.url}','yt_hd.mp4')">DOWNLOAD MP4 HD</button></div></div></div>`;statusEl.innerText='yt • ready';return;}}catch(e){}
}

// IG ANTI BACKUP - LANGSUNG HD
async function dlIG(url){
 const igId=url.split('/p/')[1]?.split('/')[0]||url.split('/reel/')[1]?.split('/')[0]||url.split('/reels/')[1]?.split('/')[0]||url.split('/')[4]||'';
 statusEl.innerText='ig • server 1/3 wuk.sh...';resultsEl.innerHTML=`<div class="card"><div style="flex:1"><b>IG • Fetching HD No WM...</b><small>${igId} • 3 servers anti backup • ${url.substring(0,40)}...</small></div></div>`;

 // 1 - wuk.sh (paling ampuh)
 try{
  let r=await fetch('https://co.wuk.sh/api/json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url,vQuality:'1080'})});
  let j=await r.json();
  if(j.url){return showIG(j.url,'IG HD via wuk.sh • No WM');}
  if(j.picker&&j.picker.length){return showPicker(j.picker);}
 }catch(e){}

 // 2 - cobalt.tools
 try{
  statusEl.innerText='ig • server 2/3 cobalt...';
  let r=await fetch('https://api.cobalt.tools/api/json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url,vQuality:'1080'})});
  let j=await r.json();
  if(j.url){return showIG(j.url,'IG HD via cobalt • No WM');}
  if(j.picker&&j.picker.length){return showPicker(j.picker);}
 }catch(e){}

 // 3 - LANGSUNG DDINSTAGRAM + PREVIEW (ANTI GAGAL - PASTI MUNCUL HD)
 statusEl.innerText='ig • server 3/3 direct hd...';
 const ddUrl=`https://www.ddinstagram.com/p/${igId}/`;
 const imgInnUrl=`https://www.ddinstagram.com/reel/${igId}/`;

 resultsEl.innerHTML=`
 <div class="preview">
  <img class="p" src="https://instagram.com/p/${igId}/media/?size=l" onerror="this.src='bg.jpg'">
  <div class="info">
   <span style="display:inline-block;padding:4px 10px;border-radius:10px;background:rgba(142,207,255,.12);color:#8ecfff;font-size:9px;letter-spacing:1px;border:1px solid rgba(142,207,255,.2);margin-bottom:8px">INSTAGRAM • HD NO WM • DIRECT</span>
   <b>IG Post/Reels • HD No WM • Ready</b>
   <small>id: ${igId} • mp4=mp4 foto=foto hd • no watermark • direct hd tanpa backup</small>
   <div class="btns" style="margin-top:12px">
     <button class="btn btn2" style="flex:1;padding:12px" onclick="window.open('${ddUrl}','_blank')">BUKA HD DI DDINSTA (TAP HOLD SAVE)</button>
   </div>
   <div class="btns">
     <button class="btn btn2" onclick="window.open('https://www.ddinstagram.com/reel/${igId}/','_blank')">REELS HD DD</button>
     <button class="btn btn2" onclick="window.open('https://snapinsta.app/?url=${encodeURIComponent(url)}','_blank')">SNAPINSTA HD</button>
     <button class="btn btn2" onclick="window.open('https://igram.world/?url=${encodeURIComponent(url)}','_blank')">IGRAM HD</button>
     <button class="btn btn2" onclick="window.open('https://saveig.app/en?url=${encodeURIComponent(url)}','_blank')">SAVEIG HD</button>
   </div>
   <small style="margin-top:10px;opacity:.5">tips: klik BUKA HD DI DDINSTA, nanti video/foto asli muncul, tap tahan → save video/gambar = HD No WM!</small>
  </div>
 </div>
 <div class="card"><div style="flex:1"><b>Direct HD Link</b><small>kalo mau download 1 tap: ${url}</small><div class="btns"><button class="btn btn2" onclick="downloadFile('${ddUrl}','ig_${igId}.mp4')">TRY DOWNLOAD MP4 HD</button><button class="btn" onclick="window.open('https://instagram.com/p/${igId}/media/?size=l','_blank')">OPEN JPG HD DIRECT</button></div></div></div>
 `;

 // coba ambil direct media via allorigins untuk preview beneran
 try{
  const proxy='https://api.allorigins.win/get?url='+encodeURIComponent(ddUrl);
  let r=await fetch(proxy);
  let j=await r.json();
  let html=j.contents;
  let v=html.match(/"video_url":"([^"]+)"/)||html.match(/"videoUrl":"([^"]+)"/)||html.match(/href="([^"]+\.mp4[^"]*)"/);
  let i=html.match(/"display_url":"([^"]+)"/)||html.match(/property="og:video" content="([^"]+)"/)||html.match(/property="og:image" content="([^"]+)"/);
  let mediaUrl=v?v[1].replace(/\\u0026/g,'&').replace(/\\/g,''): (i?i[1].replace(/\\u0026/g,'&').replace(/\\/g,''):'');
  if(mediaUrl&&mediaUrl.includes('http')){
   showIG(mediaUrl,'IG HD via DD Proxy • No WM');
  }
 }catch(e){}
}
function showIG(url,title){
 const isVideo=url.includes('.mp4')||url.includes('video')||url.includes('scontent')&&url.includes('.mp4');
 statusEl.innerText=`ig ${isVideo?'reels':'post'} • hd ready • no wm`;
 resultsEl.innerHTML=`<div class="preview">${isVideo?`<video class="p" src="${url}" controls playsinline autoplay muted loop></video>`:`<img class="p" src="${url}">`}<div class="info"><b>${title}</b><small>${isVideo?'mp4 = mp4 hd • no wm':'foto = foto hd • no wm'} • ready</small><div class="btns"><button class="btn btn2" style="padding:12px;width:100%" onclick="downloadFile('${url}','ig_hd_${Date.now()}.${isVideo?'mp4':'jpg'}')">DOWNLOAD ${isVideo?'MP4':'JPG'} HD NO WM</button><button class="btn" onclick="window.open('${url}','_blank')">OPEN DIRECT HD</button></div></div></div>`;
}
function showPicker(picker){
 statusEl.innerText=`ig carousel • ${picker.length} files • hd`;
 resultsEl.innerHTML=picker.map((p,i)=>`<div class="preview">${p.type==='video'?`<video class="p" src="${p.url}" controls></video>`:`<img class="p" src="${p.url||p.thumb}">`}<div class="info"><b>File ${i+1} • HD No WM</b><div class="btns"><button class="btn btn2" onclick="downloadFile('${p.url}','ig_${i+1}_hd.${p.ext||'mp4'}')">DOWNLOAD ${p.ext?.toUpperCase()||'HD'} NO WM</button></div></div></div>`).join('');
}
function downloadFile(url,name){const a=document.createElement('a');a.href=url;a.download=name;a.target='_blank';document.body.appendChild(a);a.click();a.remove();statusEl.innerText='downloaded • '+name;}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')handle();});
</script>
</body>
</html>
