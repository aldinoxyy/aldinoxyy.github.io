<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lexa Download - HD No WM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;background:#05070d;color:#e8e8e8;font-family:'Inter',system-ui;background-image:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.9)),url('bg.jpg');background-size:cover;background-position:center;background-attachment:fixed}
.h{padding:16px 20px;display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.06);backdrop-filter:blur(10px)}
.logo{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:24px}.logo span{color:#8ecfff}
.t{margin-top:30px;text-align:center;font-family:'Cormorant Garamond',serif;font-size:42px;font-weight:600}.t span{color:#8ecfff}
.sub{text-align:center;opacity:.35;letter-spacing:5px;font-size:10px;margin-top:6px}
.box{margin:26px auto;max-width:560px;width:90%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:28px;display:flex;align-items:center;padding:0 6px 0 18px;backdrop-filter:blur(14px)}
.box input{flex:1;background:transparent;border:none;outline:none;color:#fff;padding:16px 10px;font-size:13px}
.box button{background:#8ecfff;color:#000;border:none;padding:12px 22px;border-radius:22px;font-size:10px;font-weight:700;letter-spacing:1.5px;cursor:pointer}
#status{text-align:center;margin-top:18px;font-size:11px;letter-spacing:2px;opacity:.6;text-transform:uppercase;min-height:16px}
.results{max-width:580px;margin:16px auto;padding:0 14px;flex:1;width:100%}
.preview{background:rgba(18,22,36,.96);border:1px solid rgba(142,207,255,.25);border-radius:22px;overflow:hidden;margin-bottom:12px;backdrop-filter:blur(10px)}
.preview img.p,.preview video{width:100%;max-height:580px;object-fit:contain;display:block;background:#000}
.info{padding:18px;text-align:center}
.info b.by{display:block;font-size:13px;font-weight:600;letter-spacing:1px;margin-bottom:12px}
.btn-download{width:100%;background:#8ecfff;color:#000;border:none;padding:14px;border-radius:14px;font-size:13px;font-weight:700;letter-spacing:1px;cursor:pointer;margin-top:6px}
.footer{margin-top:auto;text-align:center;padding:30px 0 20px;opacity:.35;font-size:10px}
</style>
</head>
<body>
<div class="h"><div><div class="logo"><span>Lexa</span> Download</div><div style="opacity:.4;font-size:9px;letter-spacing:3px;margin-top:2px">SIMPLE 1 BUTTON</div></div><div style="opacity:.35;font-size:9px">HD NO WM</div></div>
<div class="t">Lèxaa <span>Download</span></div>
<div class="sub">SPOTIFY • TIKTOK • IG • YT • HD NO WM</div>
<div class="box"><input id="q" placeholder="paste link ig / tiktok / yt / spotify..."><button onclick="handle()">DOWNLOAD</button></div>
<div id="status">simple 1 button • download by LèxaaMj</div>
<div class="results" id="results"></div>
<div class="footer">© 2026 download by LèxaaMj</div>
<script>
const statusEl=document.getElementById('status'),resultsEl=document.getElementById('results');
function detect(u){u=u.toLowerCase();if(u.includes('tiktok'))return 'tiktok';if(u.includes('instagram'))return 'ig';if(u.includes('youtube')||u.includes('youtu.be'))return 'yt';if(u.includes('spotify'))return 'spotify';return 'search';}
function extractUrl(t){const m=t.match(/https?:\/\/[^\s]+/i);return m?m[0].replace(/[.,;!\)]+$/,'').trim():t.trim();}
async function handle(){
 const raw=document.getElementById('q').value.trim();if(!raw)return;
 const url=extractUrl(raw);document.getElementById('q').value=url;
 const t=detect(url);
 if(t==='search')searchSpotify(url);
 else if(t==='tiktok')dlTikTok(url);
 else if(t==='ig')dlIG(url);
 else if(t==='yt')dlYT(url);
 else if(t==='spotify')searchSpotify(url);
}
async function searchSpotify(q){
 statusEl.innerText='searching...';resultsEl.innerHTML='';
 try{let r=await fetch('https://api.spotifydown.com/search/'+encodeURIComponent(q));let j=await r.json();if(j.success&&j.trackList.length){resultsEl.innerHTML=j.trackList.map(t=>`<div class="preview"><img class="p" src="${t.cover}"><div class="info"><b class="by">download by LèxaaMj</b><button class="btn-download" onclick="dlSpotify('${t.id}','${t.title.replace(/'/g,'')}')">Download</button></div></div>`).join('');return;}}catch(e){}
}
async function dlSpotify(id,title){try{let r=await fetch('https://api.spotifydown.com/download/'+id);let j=await r.json();if(j.success&&j.link){downloadFile(j.link,title+'.mp3');return;}}catch(e){}}
async function dlTikTok(url){
 statusEl.innerText='tiktok • hd...';
 try{let r=await fetch('https://www.tikwm.com/api/?url='+encodeURIComponent(url)+'&hd=1');let j=await r.json();if(j.data){let d=j.data;let media=d.play||d.images?.[0];let isV=!!d.play;resultsEl.innerHTML=`<div class="preview">${isV?`<video class="p" src="${d.play}" poster="${d.cover}" controls playsinline></video>`:`<img class="p" src="${media}">`}<div class="info"><b class="by">download by LèxaaMj</b><button class="btn-download" onclick="downloadFile('${media}','tiktok_hd.${isV?'mp4':'jpg'}')">Download</button></div></div>`;statusEl.innerText='tiktok • ready';return;}}catch(e){}
}
async function dlYT(url){
 statusEl.innerText='yt • hd...';
 try{let res=await fetch('https://co.wuk.sh/api/json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url,vQuality:'1080'})});let data=await res.json();if(data.url){resultsEl.innerHTML=`<div class="preview"><div class="info"><b class="by">download by LèxaaMj</b><button class="btn-download" onclick="downloadFile('${data.url}','yt_hd.mp4')">Download</button></div></div>`;statusEl.innerText='yt • ready';return;}}catch(e){}
}
async function dlIG(url){
 const igId=url.split('/p/')[1]?.split('/')[0]||url.split('/reel/')[1]?.split('/')[0]||url.split('/reels/')[1]?.split('/')[0]||url.split('/')[4]||'';
 statusEl.innerText='ig • fetching hd...';
 resultsEl.innerHTML=`<div class="preview"><div class="info"><b class="by">download by LèxaaMj</b><small>fetching...</small></div></div>`;
 try{
  let r=await fetch('https://co.wuk.sh/api/json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url,vQuality:'1080'})});
  let j=await r.json();
  if(j.url){
   const isV=j.url.includes('.mp4')||j.url.includes('video');
   resultsEl.innerHTML=`<div class="preview">${isV?`<video class="p" src="${j.url}" controls playsinline></video>`:`<img class="p" src="${j.url}">`}<div class="info"><b class="by">download by LèxaaMj</b><button class="btn-download" onclick="downloadFile('${j.url}','ig_hd_${igId}.${isV?'mp4':'jpg'}')">Download</button></div></div>`;
   statusEl.innerText='ig • hd ready • download by LèxaaMj';
   return;
  }
  if(j.picker&&j.picker.length){
   resultsEl.innerHTML=j.picker.map((p,i)=>`<div class="preview">${p.type==='video'?`<video class="p" src="${p.url}" controls></video>`:`<img class="p" src="${p.url||p.thumb}">`}<div class="info"><b class="by">download by LèxaaMj</b><button class="btn-download" onclick="downloadFile('${p.url}','ig_${i+1}_hd.${p.ext||'mp4'}')">Download</button></div></div>`).join('');
   statusEl.innerText=`ig carousel ${j.picker.length} • download by LèxaaMj`;
   return;
  }
 }catch(e){}
 // fallback tanpa ddinsta - direct cdn ig
 resultsEl.innerHTML=`
 <div class="preview">
  <img class="p" src="https://instagram.com/p/${igId}/media/?size=l" onerror="this.src='bg.jpg'">
  <div class="info">
   <b class="by">download by LèxaaMj</b>
   <button class="btn-download" onclick="downloadFile('https://instagram.com/p/${igId}/media/?size=l','ig_${igId}_hd.jpg')">Download</button>
  </div>
 </div>`;
 statusEl.innerText='ig • hd ready • download by LèxaaMj';
}
function downloadFile(url,name){
 const a=document.createElement('a');a.href=url;a.download=name;a.target='_blank';document.body.appendChild(a);a.click();a.remove();statusEl.innerText='downloaded • download by LèxaaMj';
}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')handle();});
</script>
</body>
</html>
